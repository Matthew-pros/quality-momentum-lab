name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Streamlit Cloud logs have used Python 3.14; keep 3.12 as the
        # conservative reference runtime and test both supported environments.
        python-version: ["3.12", "3.14"]
    name: Python ${{ matrix.python-version }} / quality checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pytest
      - name: Compile application
        run: python -m compileall -q app.py qlab tests
      - name: Run regression and Streamlit smoke tests
        run: python -m pytest -q
