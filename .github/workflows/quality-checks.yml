name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip "pandas>=2.2" numpy pytest
      - name: Compile application
        run: python -m py_compile app.py
      - name: Run math regression tests
        run: python -m pytest -q
