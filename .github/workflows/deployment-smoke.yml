name: Public deployment smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_url:
        description: Public Streamlit Community Cloud URL (HTTPS *.streamlit.app only)
        required: true
        default: https://quality-momentum-lab-d48ep9tlvdzdufjr23z4wq.streamlit.app
        type: string
  schedule:
    # Weekly recheck plus a push-triggered check that waits for the expected version marker after host redeploy.
    - cron: "30 8 * * 1"

permissions:
  contents: read

concurrency:
  group: public-deployment-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    container:
      # Pinned Playwright Python image includes matching Chromium and OS libraries,
      # so the deployment check does not spend minutes apt-installing browser dependencies.
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install matching Playwright Python package
        run: python -m pip install --disable-pip-version-check playwright==1.63.0
      - name: Check public deployment
        env:
          MANUAL_APP_URL: ${{ inputs.app_url }}
          DEFAULT_APP_URL: https://quality-momentum-lab-d48ep9tlvdzdufjr23z4wq.streamlit.app
        run: |
          if [ -n "$MANUAL_APP_URL" ]; then
            APP_URL="$MANUAL_APP_URL"
          else
            APP_URL="$DEFAULT_APP_URL"
          fi
          python .github/scripts/public_app_smoke.py --url "$APP_URL"
